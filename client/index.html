<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/noxira-icon.png" />
    <link rel="apple-touch-icon" href="/noxira-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NOXIRA Technologies - custom web and mobile software development, plus structured engineering internships with publicly verifiable certificates."
    />
    <title>NOXIRA Technologies | Software Development & Engineering Internships</title>
    <style>
      /* Boot loader: orbital NOXIRA "O" mark, shown until the React app mounts */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f8fafc;
        transition: opacity 0.45s ease;
      }
      #boot-loader.boot-loader-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .boot-orbit {
        width: 84px;
        height: 84px;
        animation: boot-spin 2.6s linear infinite;
      }
      #boot-loader .boot-word {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: 0.42em;
        font-size: 13px;
        color: #0b1f3a;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot-loader .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
        position: relative;
      }
      #boot-loader .boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #06b6d4);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes boot-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="NOXIRA website loading">
      <img class="boot-orbit" src="/noxira-icon.png" alt="" width="84" height="84" />
      <div class="boot-word">NOXIRA</div>
      <div class="boot-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
